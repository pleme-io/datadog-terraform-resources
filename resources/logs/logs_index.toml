[resource]
name = "datadog_logs_index"
description = "Manages a Datadog Logs index for routing and retention"
category = "logs"

[crud]
create_endpoint = "/api/v1/logs/config/indexes"
create_schema = "LogsIndex"
update_endpoint = "/api/v1/logs/config/indexes/{name}"
update_schema = "LogsIndexUpdateRequest"
read_endpoint = "/api/v1/logs/config/indexes/{name}"
read_schema = "LogsIndexGet"
read_response_schema = "LogsIndex"
delete_endpoint = "/api/v1/logs/config/indexes/{name}"
delete_schema = "LogsIndexDelete"

[identity]
id_field = "name"
import_field = "name"
force_new_fields = ["name"]

[fields.name]
type = "String"
required = true
description = "Name of the log index"

[fields.filter]
type = "String"
required = true
description = "JSON-encoded filter query for the index"

[fields.exclusion_filters]
type = "String"
required = false
description = "JSON-encoded list of exclusion filter definitions"

[fields.daily_limit]
type = "Integer"
required = false
description = "Daily limit of indexed log events"

[fields.daily_limit_reset]
type = "String"
required = false
description = "JSON-encoded reset time for the daily limit (hour, minute, timezone)"

[fields.daily_limit_warning_threshold_percentage]
type = "Float"
required = false
description = "Percentage threshold for daily limit warning"

[fields.retention_days]
type = "Integer"
required = false
description = "Number of days to retain indexed logs"

[fields.disable_daily_limit]
type = "Boolean"
required = false
description = "Disable the daily limit for this index"
