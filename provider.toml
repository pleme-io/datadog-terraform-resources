[provider]
name = "datadog"
version = "0.1.0"
description = "Datadog observability platform"

[provider.auth]
api_key = { type = "String", required = true, sensitive = true, env = "DD_API_KEY" }
app_key = { type = "String", required = true, sensitive = true, env = "DD_APP_KEY" }
api_url = { type = "String", required = false, default = "https://api.datadoghq.com", env = "DD_API_URL" }

[provider.skip_fields]
fields = ["validate"]
